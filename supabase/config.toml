# ==============================================================================
# Supabase config — flags por edge function
# ==============================================================================
# Esse arquivo trava as configurações de cada função no git.
# Toda vez que `supabase functions deploy` rodar, ele respeita isso.
# Sem esse arquivo, deploys sem flag explícita resetam pro default (verify_jwt=true)
# e quebram a cadeia incoming-lead → send_whatsapp_message silenciosamente.
#
# Categorias:
#  - PÚBLICA: webhook externo (Make, Facebook, Evolution) — verify_jwt = false
#  - INTERNA: chamada por outras edge functions ou pg_cron — verify_jwt = false
#  - FRONTEND: chamada apenas pelo dashboard com user logado — verify_jwt = true
#
# Toda função que aparece no incoming-lead, scheduler, agentes, ou cron deve
# estar com verify_jwt = false pra cadeia automática funcionar.
# ==============================================================================

[functions.send_whatsapp_message]
verify_jwt = false  # INTERNA — chamada por orchestrator, scheduler, agentes

[functions.send-whatsapp]
verify_jwt = false  # INTERNA — wrapper alternativo

[functions.webhook_receiver]
verify_jwt = false  # PÚBLICA — Evolution API webhook

[functions.incoming-lead]
verify_jwt = false  # PÚBLICA — Make/Facebook webhook

[functions.orchestrator]
verify_jwt = false  # INTERNA — disparado por trigger_active_campaigns + frontend

