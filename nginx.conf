server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redireciona todas as rotas para index.html (necessário para React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash no nome (gerados pelo Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sem cache para index.html (garante que o app atualizado seja servido)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
